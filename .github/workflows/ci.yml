name: CI

# Linux/macOS/Windows × Node 18/20/22/24/26 (the package floor is >=18).
#
#   - test:                    15-cell OS × Node matrix; typecheck, test, lint,
#                              build, plain-Node dist import smoke
#   - network-disabled-smoke:  the same gates with no network, plus proof that
#                              importing and constructing a facade makes no calls
#   - bundle-size:             per-entry gzip ceilings + tree-shaking spot-check
#
# Repo-level gates (license, lifecycle scripts, README/.ai presence) live in
# lint-gates.yml. Self-contained: no external reusable workflows.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # --no-audit/--no-fund skip the extra registry calls; the fetch flags
      # cap npm's very patient defaults so a stalled registry connection
      # fails the step in minutes, not hours.
      - run: npm ci --no-audit --no-fund --fetch-timeout=60000 --fetch-retries=3 --fetch-retry-maxtimeout=15000
        timeout-minutes: 8

      - run: npm run typecheck

      - name: Tests (with coverage on canonical cell)
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ] && [ "${{ matrix.node }}" = "22" ]; then
            npm run test:coverage
          else
            npm test
          fi
        shell: bash

      - run: npm run lint

      - run: npm run build

      # Import-smoke the built output with plain Node (CJS require + ESM
      # import). Bundler-based steps tolerate extensionless specifiers that
      # Node's ESM loader rejects, so this is the gate that catches a broken
      # dist/esm emit.
      - run: npm run check:dist

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  network-disabled-smoke:
    name: network-disabled smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund --fetch-timeout=60000 --fetch-retries=3 --fetch-retry-maxtimeout=15000
        timeout-minutes: 8

      # Everything below runs inside a network NAMESPACE (`unshare -n`): it has
      # no interface except an isolated loopback, so no egress is possible at
      # any privilege level. The Actions runner agent lives OUTSIDE the
      # namespace and keeps streaming logs. Do NOT swap this for host-wide
      # firewall rules (iptables): they also cut off the runner agent (same
      # non-root `runner` user) and the job hangs until GitHub declares the
      # runner lost.
      - name: Offline gate — typecheck, test, lint, build, dist smoke (no egress)
        timeout-minutes: 12
        run: |
          sudo env "PATH=$PATH" "HOME=$HOME" unshare -n bash -e -c '
            ip link set lo up
            npm run typecheck
            npm test
            npm run lint
            npm run build
            npm run check:dist
          '

      # The namespace stops sockets; the fetch guard names the culprit if an
      # import-time call is ever introduced.
      - name: Import + construct without network
        run: |
          sudo env "PATH=$PATH" "HOME=$HOME" unshare -n node -e "
            globalThis.fetch = () => { throw new Error('Unexpected import-time fetch'); };
            const lib = require('./dist/cjs/index.js');
            const f = new lib.Email('sendgrid', { apiKey: 'k' });
            if (f.id !== 'sendgrid') { console.error('expected id sendgrid'); process.exit(1); }
            console.log('OK — import + construction made zero network calls.');
          "

      # Self-test of the gate itself: the same namespace must FAIL a real
      # network call. Guards against unshare silently degrading.
      - name: Prove the namespace actually blocks egress
        run: |
          if sudo unshare -n curl -s --max-time 5 https://registry.npmjs.org/ > /dev/null 2>&1; then
            echo "::error::Network namespace did not block egress — offline gate is not actually offline."
            exit 1
          fi
          echo "OK — egress blocked inside the namespace."

  # `npm run size` (size-limit) bundles each entry in `.size-limit.json` with
  # esbuild (tree-shaking + minify), gzips it, and fails over its ceiling:
  #   Tier A connector < 15 KB · Tier B connector < 30 KB
  # Node built-ins are ignored — they're provided by the runtime, not shipped.
  bundle-size:
    name: bundle size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund --fetch-timeout=60000 --fetch-retries=3 --fetch-retry-maxtimeout=15000
        timeout-minutes: 8

      # check:tree-shaking bundles the built dist/esm entry, so build first.
      - run: npm run build

      - name: Bundle-size gate
        run: npm run size

      - name: Tree-shaking spot-check
        run: npm run check:tree-shaking
